# Límites pensados para equipos de 8 GB de RAM: con -Xmx8G el daemon de Gradle
# podía ocupar toda la memoria y el sistema entraba en swap.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
